name: Monitor new RERA projects

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rera-project-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATE_DB: data/haryana_rera.sqlite3
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_STARTTLS: "true"
      SMTP_USERNAME: bharadwajr278@gmail.com
      SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_FROM: bharadwajr278@gmail.com
      EMAIL_TO: bharadwajr278@gmail.com
      ALERT_ON_FIRST_RUN: "false"
      DRY_RUN: "false"
      ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      OAI_SITES_AUTH_TOKEN: ${{ secrets.OAI_SITES_AUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Confirm email secret is configured
        shell: bash
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "GMAIL_APP_PASSWORD is not configured in repository Actions secrets." >&2
            exit 1
          fi

      - name: Check official RERA feeds and send new alerts
        run: python monitor.py --once

      - name: Persist deduplication state
        shell: bash
        run: |
          if git diff --quiet -- data/haryana_rera.sqlite3; then
            echo "No state change to persist."
            exit 0
          fi
          git config user.name "rera-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force data/haryana_rera.sqlite3
          git commit -m "chore: update RERA monitor state [skip ci]"
          git push
